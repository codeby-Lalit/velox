[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "circuit-networks"
version = "0.2.1"
description = "Offline intelligent DOCX manuscript formatting engine with integrity verification"
requires-python = ">=3.11"
dependencies = [
    "python-docx>=1.1",
    "lxml>=4.9",
    "pydantic>=2.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"